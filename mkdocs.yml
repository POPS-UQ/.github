site_name: POPS-UQ
site_description: Misspecification-aware Bayesian regression for low-noise data (POPS algorithm)
site_url: https://pops-uq.github.io/
site_author: POPS-UQ contributors

repo_url: https://github.com/POPS-UQ
repo_name: POPS-UQ
copyright: Copyright &copy; 2025 POPS-UQ contributors

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/extra.css

plugins:
  - search

nav:
  - index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Background: theory.md
  - Examples:
      - examples/index.md
      - Simple regression (Python): examples/python-simple.md
      - ACE potential (Julia): examples/julia-ace.md
      - Uncertainty in MD (Julia): examples/julia-md.md
  - API reference: api/index.md
